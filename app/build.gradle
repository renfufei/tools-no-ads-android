plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tools.cnc'
    compileSdk 35

    defaultConfig {
        applicationId "com.tools.cnc"
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "1.0.2"
        setProperty("archivesBaseName", "tools-cnc-app-v${versionName}")
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // AndroidX Core
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.fragment:fragment:1.8.3'

    // Navigation
    implementation 'androidx.navigation:navigation-fragment:2.8.2'
    implementation 'androidx.navigation:navigation-ui:2.8.2'

    // Lifecycle (ViewModel + LiveData)
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'

    // ZIP compression/decompression with encryption - zip4j
    implementation 'net.lingala.zip4j:zip4j:2.11.5'

    // RAR decompression - junrar (pure Java)
    implementation 'com.github.junrar:junrar:7.5.5'

    // HEIC writing support
    implementation 'androidx.heifwriter:heifwriter:1.0.0'

    // ExifInterface (image metadata)
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // QR code generate/decode - zxing core (pure Java)
    implementation 'com.google.zxing:core:3.5.3'

    // CameraX (QR live scan)
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
}
